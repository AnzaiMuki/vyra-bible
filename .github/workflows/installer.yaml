name: Windows installer
run-name: Windows installer (${{ github.ref_name }})

# Builds the plugin and the setup .exe on a GitHub Windows runner, so that no local
# Visual Studio is needed. Start it from the "Actions" tab (Run workflow), or push a tag "v*".
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # only to attach the setup to a GitHub Release when a tag v* is pushed

jobs:
  installer:
    name: Build setup .exe
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build plugin and setup
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Upload setup
        uses: actions/upload-artifact@v4
        with:
          name: VYRA-Bible-Setup
          path: |
            release/VYRA-Bible-Setup-*.exe
            release/VYRA-Bible-*-manual.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      # A tag "v0.5.0" publishes the setup on the repository's Releases page, where anyone can download it.
      - name: Check that the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match buildspec.json version $version"
          }

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/VYRA-Bible-Setup-*.exe
            release/VYRA-Bible-*-manual.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
